insightledger:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DB_HOST', 'localhost') }}"
      user: "{{ env_var('DB_USER', 'admin') }}"
      password: "{{ env_var('DB_PASSWORD', 'password') }}"
      port: 5432
      dbname: "{{ env_var('DB_NAME', 'insightledger') }}"
      schema: public
      threads: 4
