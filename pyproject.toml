[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "insightledger"
version = "0.1.0"
description = "Decision-support analytics: governed KPI definitions, reconciled data, self-serve dashboards, and statistically sound experiment analysis."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dbt-postgres>=1.7.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "statsmodels>=0.14.0",
    "psycopg2-binary>=2.9.0",
    "sqlalchemy>=2.0.0",
    "faker>=20.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "jupyter>=1.0.0",
    "pre-commit>=3.5.0"
]

[tool.hatch.build.targets.wheel]
packages = ["insightledger"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
